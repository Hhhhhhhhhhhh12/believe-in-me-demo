name: Browser Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned Playwright
        run: python -m pip install 'playwright==1.64.1'
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run real-browser smoke test
        run: python -m unittest discover -s tests/browser -p 'test_*.py' -v
