[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "believe-in-me-demo"
version = "0.1.0"
description = "A deterministic turn-based resource engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.scripts]
believe-demo = "believe_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
